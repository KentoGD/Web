  <circle cx="110" cy="38" r="27" fill="#40708F"/>
  <circle cx="100" cy="118" r="63" fill="#40708F"/>

  <!-- NIÑO: silueta blanca compacta dentro del abrazo -->
  <circle cx="72" cy="84" r="19" fill="#FFFFFF"/>
  <ellipse cx="74" cy="118" rx="26" ry="23" fill="#FFFFFF"/>

  <!-- INFINITO (neurodiversidad), abajo a la derecha -->
