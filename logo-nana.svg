           C130 145 104 145 104 162
           C104 179 130 179 140 162 Z"
        fill="none" stroke="#62B8B0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PERRO dentro del lazo derecho -->
  <g fill="#40708F">
    <path d="M159 153 c-1 -6 1 -9 4 -8 c3 1 4 4 4 9 z"/>
    <path d="M177 153 c1 -6 -1 -9 -4 -8 c-3 1 -4 4 -4 9 z"/>
    <ellipse cx="168" cy="163" rx="11" ry="10"/>
  </g>
  <circle cx="164" cy="160.5" r="1.9" fill="#EAF6F4"/>
  <circle cx="172" cy="160.5" r="1.9" fill="#EAF6F4"/>
  <ellipse cx="168" cy="167" rx="2.6" ry="2" fill="#EAF6F4"/>
</svg>
